spring:
  datasource:
    url: jdbc:h2:mem:testDB
    driver-class-name: org.h2.Driver
    username: usuariodb
    password: contraseñadb
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console


  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-intialization: true
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
